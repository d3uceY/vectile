<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vectile-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>vectile</title>
    <script>
      /* Resolve the theme before first paint so there is no flash of the wrong
         one. Mirrors frontend/src/lib/theme.ts: "system" follows the OS. */
      (function () {
        try {
          var pref = localStorage.getItem("vectile.theme");
          var dark =
            pref === "dark" ||
            ((pref === "system" || !pref) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: a local knowledge library that feels like a calm, cool-neutral
      reference desk - bright, precise, quietly clever; it refuses the dark
      "AI retrieval" default and the neon-glass dashboard.
      OWN-WORLD: white ground, panel cards, hairline borders, a five-stop text
      ladder, Albert Sans type, mono data lines, one dark-green accent for
      active/selected/action.
      STORY: the user's whole private library is searchable in one calm, fast
      surface; nothing leaves the machine.
      FIRST VIEWPORT: sidebar wordmark + nav, 44px chrome strip, one search bar,
      a filter row, and a centered "Ask your library" idle state.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-label="vectile — your private library">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.25" cy="1.25" r="1.25" fill="#1b2226" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- paper ground + graph-paper dots -->
  <rect width="1440" height="500" fill="#fbfcff"/>
  <rect width="1440" height="500" fill="url(#dots)"/>

  <!-- hairline frame -->
  <rect x="0.5" y="0.5" width="1439" height="499" fill="none" stroke="#e4e8ec"/>

  <!-- app's original logo at the top of the banner -->
  <image x="82" y="48" width="48" height="48" preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64," xlink:href="data:image/png;base64,"/>

  <!-- mascot on a white card, from the app's own sprite sheet -->
  <rect x="80" y="126" width="160" height="160" rx="20" fill="#ffffff" stroke="#d1d8de"/>
  <image x="94" y="150" width="132" height="111" preserveAspectRatio="xMidYMid meet"
         style="image-rendering:pixelated"
         href="data:image/png;base64," xlink:href="data:image/png;base64,"/>

  <!-- wordmark -->
  <text x="272" y="214" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#1b2226">vectile</text>

  <!-- serif-italic tagline + leaf underscore -->
  <text x="276" y="270" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="23" fill="#56616b">your private library</text>
  <rect x="280" y="286" width="46" height="3" rx="1.5" fill="#1f8a50"/>

  <!-- vertical hairline between the lockup and the data block -->
  <line x1="1010" y1="118" x2="1010" y2="382" stroke="#e4e8ec"/>

  <!-- right data block: left accent rule + prominent all-local -->
  <rect x="1076" y="126" width="4" height="232" rx="2" fill="#1f8a50"/>
  <text x="1108" y="156" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f8a50">all local</text>

  <text x="1108" y="200" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#1b2226">hybrid search — vector + full-text</text>
  <text x="1108" y="228" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#1b2226">bge-m3 embeddings, in-process</text>
  <text x="1108" y="256" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#1b2226">nothing leaves this machine</text>

  <line x1="1108" y1="282" x2="1396" y2="282" stroke="#e4e8ec"/>
  <text x="1108" y="324" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#66707a">jump to search · ⌘K</text>
</svg>

# Windows release pipeline for vectile (Wails v3).
#
# Push a stable `vX.Y.Z` tag → builds the Windows binary + NSIS installer,
# attaches both to a GitHub Release with checksums, and deletes the tag again
# if the build fails.
#
# Ported from the wails3-release skill; adapted for vectile:
#   - Windows uses the committed MinGW archives; choco mingw 16.1.0 is pinned
#     so the C++ ABI matches them (vectile links llama.cpp).
#   - Linux/macOS build their per-OS llama.cpp archives on the runner first
#     (scripts/build-llamago-archives.sh) because only the Windows archives are
#     checked in; the vendored llama.cpp/ tree is headers-only.
#   - CGO_ENABLED=1 (vectile links llama.cpp), not CGO=0.
#   - The 5 MinGW runtime DLLs ship beside the exe and in the installer
#     (committed under build/windows/runtime).
#   - The version is injected into main.go's `Version` var (with the `v`).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-windows-amd64:
    runs-on: windows-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis not found after NSIS installation"
          }
          Write-Host "Using makensis at $((Get-Command makensis).Source)"

      - name: Install MinGW-w64 (for the CGO llama.cpp link)
        shell: pwsh
        run: |
          # Pin the choco mingw version: the committed llama-go archives were
          # built with MinGW-w64 GCC 16.1.0 (WinLibs UCRT/posix/seh), and the
          # choco mingw 16.1.0 package installs that same GCC 16.1.0 toolchain.
          # The runner ALSO ships a preinstalled MinGW at C:\mingw64 (GCC
          # 15.2.0) which is on PATH and would win over the choco install; its
          # libstdc++ ABI mismatches the archives (undefined std::__get_once_*),
          # so resolve the choco-installed GCC explicitly and pin CC/CXX to it.
          choco install mingw --version=16.1.0 -y --no-progress

          # The mingw package installs to C:\ProgramData\mingw64 (it MOVES its
          # lib\mingw\tools\install dir there and adds mingw64\bin to the machine
          # PATH). Search that root only, NOT via Get-Command gcc (that would
          # find the runner's preinstalled 15.2.0 first).
          $gcc = Get-ChildItem (Join-Path $env:ProgramData "mingw64") -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after MinGW installation" }
          $mingwBin = $gcc.DirectoryName

          $ver = (& (Join-Path $mingwBin "gcc.exe") --version | Select-Object -First 1)
          if ($ver -notmatch '16\.') { throw "Expected GCC 16.x from choco mingw 16.1.0, got: $ver" }

          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          # Pin CC/CXX for the go build step so cgo compiles AND links with the
          # same GCC 16.1.0 the archives were built with (forward slashes for Go).
          $fwd = $mingwBin.Replace('\', '/')
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$fwd/gcc.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=$fwd/g++.exe"
          Write-Host "Using $ver at $mingwBin (CC/CXX pinned)"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        shell: bash
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Inject version into Windows metadata
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          sed -i "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"${VERSION}\"/" build/windows/info.json
          sed -i "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"${VERSION}\"/" build/windows/info.json
          sed -i "/assemblyIdentity/s/version=\"[^\"]*\"/version=\"${VERSION}\"/" build/windows/wails.exe.manifest
          sed -i "s/!define INFO_PRODUCTVERSION \"[^\"]*\"/!define INFO_PRODUCTVERSION \"${VERSION}\"/" build/windows/nsis/wails_tools.nsh

      - name: Generate .syso resource
        working-directory: build
        shell: bash
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build Windows binary
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          LIBRARY_PATH: ${{ github.workspace }}/third_party/llama-go/windows/amd64
          C_INCLUDE_PATH: ${{ github.workspace }}/third_party/llama-go
        shell: bash
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.Version=v${{ needs.validate-tag.outputs.version }}" -o build/bin/vectile-windows-amd64.exe
          rm -f wails_windows_amd64.syso

      - name: Copy MinGW runtime DLLs beside the exe
        shell: pwsh
        run: |
          foreach ($dll in @("libgcc_s_seh-1.dll","libgomp-1.dll","libstdc++-6.dll","libwinpthread-1.dll","libdl.dll")) {
            Copy-Item (Join-Path "build\windows\runtime" $dll) (Join-Path "build\bin" $dll) -Force
          }

      - name: Generate WebView2 bootstrapper
        shell: bash
        run: wails3 generate webview2bootstrapper -dir "build/windows/nsis"

      - name: Build NSIS installer
        shell: cmd
        run: |
          if not exist bin mkdir bin
          makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\vectile-windows-amd64.exe build\windows\nsis\project.nsi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\bin\vectile-windows-amd64.exe dist\vectile-windows-amd64.exe
          $installer = Get-ChildItem bin\*installer*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found in bin" }
          Copy-Item $installer.FullName dist\vectile-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/*

  build-linux-amd64:
    runs-on: ubuntu-24.04
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (GTK/WebKit + CGO toolchain)
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config cmake git libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Inject version into nfpm config
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml

      - name: Generate .desktop file
        run: wails3 generate .desktop -name "vectile" -exec "vectile" -icon "vectile" -outputfile "${{ github.workspace }}/build/linux/vectile.desktop" -categories "Development;"

      # third_party/llama-go/linux/amd64 is NOT committed (only the Windows
      # archives are). Build the llama.cpp ELF archives here so `go build` can
      # link; the script auto-detects the llama-go ref matching the vendored
      # wrapper.h. (libgomp.so.1 for the AppImage is bundled by build.sh.)
      - name: Build llama-go Linux archives
        run: |
          bash ./scripts/build-llamago-archives.sh

      - name: Build Linux binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          LIBRARY_PATH: ${{ github.workspace }}/third_party/llama-go/linux/amd64
          C_INCLUDE_PATH: ${{ github.workspace }}/third_party/llama-go
        run: |
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.Version=v${{ needs.validate-tag.outputs.version }}" -o bin/vectile

      - name: Build .deb package
        env:
          GOARCH: amd64
        run: wails3 tool package -name "vectile" -format deb -config ./build/linux/nfpm/nfpm.yaml -out bin

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cp bin/vectile build/linux/appimage/vectile
          cp build/appicon.png build/linux/appimage/vectile.png
          wails3 generate appimage -binary ./build/linux/appimage/vectile -icon ./build/linux/appimage/vectile.png -desktopfile ./build/linux/vectile.desktop -outputdir bin -builddir build/linux/appimage/build

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist
          cp bin/vectile dist/vectile-linux-amd64
          # wails3 generate appimage names the output <binary>-<arch>.AppImage
          # (e.g. vectile-x86_64.AppImage), so glob for the real filename.
          cp bin/*.AppImage dist/vectile-linux-amd64.AppImage
          cp bin/*.deb dist/vectile-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: dist/*

  build-macos:
    runs-on: macos-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Inject version into Info.plist
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          # Target the two version keys directly (not a hardcoded old value), so
          # this keeps working as the version bumps.
          sed -i '' \
            -e "/<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>${VERSION}</string>|;}" \
            -e "/<key>CFBundleShortVersionString<\/key>/{n;s|<string>[^<]*</string>|<string>${VERSION}</string>|;}" \
            build/darwin/Info.plist

      # third_party/llama-go/darwin/{arm64,amd64} is NOT committed. Build both
      # archive sets here (the runner is ARM64, so amd64 is cross-built).
      - name: Build llama-go macOS archives
        run: |
          GOARCH=arm64 bash ./scripts/build-llamago-archives.sh
          GOARCH=amd64 bash ./scripts/build-llamago-archives.sh

      - name: Build macOS ARM64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          CGO_CFLAGS: "-mmacosx-version-min=12.0 -arch arm64"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0 -arch arm64"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          LIBRARY_PATH: ${{ github.workspace }}/third_party/llama-go/darwin/arm64
          C_INCLUDE_PATH: ${{ github.workspace }}/third_party/llama-go
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.Version=v${{ needs.validate-tag.outputs.version }}" -o build/bin/vectile-arm64

      - name: Build macOS AMD64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
          CGO_CFLAGS: "-mmacosx-version-min=12.0 -arch x86_64"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0 -arch x86_64"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          LIBRARY_PATH: ${{ github.workspace }}/third_party/llama-go/darwin/amd64
          C_INCLUDE_PATH: ${{ github.workspace }}/third_party/llama-go
        run: |
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.Version=v${{ needs.validate-tag.outputs.version }}" -o build/bin/vectile-amd64

      - name: Create universal binary
        run: |
          lipo -create -output build/bin/vectile build/bin/vectile-arm64 build/bin/vectile-amd64
          # The per-arch slices and the llama-go static archives are only needed
          # to produce the universal binary. Delete them now so the .app / .dmg
          # steps keep as much of the macOS runner's limited free disk as
          # possible (hdiutil stages a temp image ~= the .app size).
          rm -f build/bin/vectile-arm64 build/bin/vectile-amd64
          rm -rf third_party/llama-go/darwin

      - name: Assemble .app bundle
        run: |
          APP=build/bin/vectile.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp build/darwin/icons.icns "$APP/Resources/iconfile.icns"
          cp build/bin/vectile       "$APP/MacOS/vectile"
          cp build/darwin/Info.plist "$APP/Info.plist"

      - name: Check disk usage before packaging
        run: |
          df -h /
          du -sh build/bin third_party/llama-go dist 2>/dev/null || true

      # The DMG needs the most free disk (hdiutil temp image ~= .app size, then
      # the compressed .dmg), so build it BEFORE the .zip adds another copy of
      # the .app to the disk.
      - name: Create DMG
        run: |
          hdiutil create -volname "vectile" -srcfolder build/bin/vectile.app -ov -format UDZO dist/vectile-macos-universal.dmg

      - name: Create .app zip
        run: |
          mkdir -p dist
          (cd build/bin && zip -9 -r ../../dist/vectile-macos-universal.zip vectile.app)

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: dist/*

  cleanup-tag-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build-windows-amd64
      - build-linux-amd64
      - build-macos
    if: |
      always() && (
        needs.build-windows-amd64.result == 'failure' ||
        needs.build-linux-amd64.result == 'failure' ||
        needs.build-macos.result == 'failure'
      )
    permissions:
      contents: write
    steps:
      - name: Delete tag
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            push origin --delete "${{ github.ref_name }}" || true

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-windows-amd64
      - build-linux-amd64
      - build-macos
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${CURR_TAG}"; else RANGE="${CURR_TAG}"; fi

          # ── Download table + first-run notes ─────────────────────────────
          {
            echo '## Download'
            echo ''
            echo '| Platform | Link | Note |'
            echo '|---|---|---|'
            echo "| Windows (installer) | [vectile-windows-amd64-installer.exe](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-windows-amd64-installer.exe) | ⚠️ SmartScreen will block it - see First-Run Notes below |"
            echo "| Windows (portable)  | [vectile-windows-amd64.exe](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-windows-amd64.exe) | |"
            echo "| Linux (AppImage)    | [vectile-linux-amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-linux-amd64.AppImage) | chmod +x, then run |"
            echo "| Linux (.deb)        | [vectile-linux-amd64.deb](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-linux-amd64.deb) | sudo apt install ./vectile-linux-amd64.deb |"
            echo "| macOS (universal)   | [vectile-macos-universal.dmg](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-macos-universal.dmg) | |"
            echo "| macOS (universal)   | [vectile-macos-universal.zip](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-macos-universal.zip) | |"
            echo ''
            echo 'SHA-256 checksums are in `SHA256SUMS.txt` attached below.'
            echo ''
            echo '## First-Run Notes'
            echo ''
            echo 'vectile is unsigned, so first launch may warn you - it'"'"'s safe and open source.'
            echo ''
            echo '- **Windows:** SmartScreen -> **More info** -> **Run anyway** (or unblock the `.exe` in Properties).'
            echo '- **macOS:** right-click the app -> **Open** (or `xattr -d com.apple.quarantine` on the `.app`).'
            echo '- **Linux:** the AppImage needs `chmod +x`; the `.deb` pulls GTK4/WebKitGTK 6.0 + `libgomp1` automatically.'
            echo ''
          } > commit_log.md

          # ── Changelog (PRs + commits + contributors) ──────────────────────
          COMMITS_FILE=$(mktemp)
          USERS_FILE=$(mktemp)
          PR_FILE=$(mktemp)
          PR_FOUND=false
          REPO="${{ github.repository }}"

          while IFS=$'\t' read -r HASH MSG; do
            [ -z "$HASH" ] && continue
            COMMIT_JSON=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/commits/${HASH}" 2>/dev/null || echo "{}")
            GH_LOGIN=$(echo "$COMMIT_JSON" | jq -r '.author.login // empty' 2>/dev/null || echo "")
            PR_JSON=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/commits/${HASH}/pulls" 2>/dev/null || echo "[]")
            PR_LINE=$(echo "$PR_JSON" | jq -r --arg repo "$REPO" --arg author "${GH_LOGIN}" '.[0] | select(. != null) | "- \(.title) [#\(.number)](https://github.com/\($repo)/pull/\(.number))" + (if $author != "" then " - @\($author)" else "" end)' 2>/dev/null || echo "")
            if [ -n "$PR_LINE" ]; then echo "$PR_LINE" >> "$PR_FILE"; PR_FOUND=true; fi
            if [ -n "$GH_LOGIN" ]; then
              echo "$GH_LOGIN" >> "$USERS_FILE"
              echo "- ${MSG} - @${GH_LOGIN}" >> "$COMMITS_FILE"
            else
              echo "- ${MSG}" >> "$COMMITS_FILE"
            fi
          done < <(git log "$RANGE" --pretty=format:"%H%x09%s" --no-merges)

          echo "## What's Changed" >> commit_log.md
          echo "" >> commit_log.md
          if [ "$PR_FOUND" = true ] && [ -s "$PR_FILE" ]; then
            echo "### Pull Requests" >> commit_log.md
            echo "" >> commit_log.md
            sort -u "$PR_FILE" >> commit_log.md
            echo "" >> commit_log.md
          fi
          if [ -s "$COMMITS_FILE" ]; then
            echo "### Commits" >> commit_log.md
            echo "" >> commit_log.md
            cat "$COMMITS_FILE" >> commit_log.md
            echo "" >> commit_log.md
          fi
          if [ -s "$USERS_FILE" ]; then
            echo "### Contributors" >> commit_log.md
            echo "" >> commit_log.md
            echo "<table><tr>" >> commit_log.md
            for USER in $(sort -u "$USERS_FILE"); do
              printf '  <td align="center"><a href="https://github.com/%s"><img src="https://github.com/%s.png?size=72" width="72" height="72" style="border-radius:50%%" /><br /><b>@%s</b></a></td>\n' "$USER" "$USER" "$USER" >> commit_log.md
            done
            echo "</tr></table>" >> commit_log.md
            echo "" >> commit_log.md
          fi

          rm -f "$COMMITS_FILE" "$USERS_FILE" "$PR_FILE"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -f artifacts/vectile-windows-amd64-installer.exe
          test -f artifacts/vectile-windows-amd64.exe
          test -f artifacts/vectile-linux-amd64.AppImage
          test -f artifacts/vectile-linux-amd64.deb
          test -f artifacts/vectile-macos-universal.dmg
          test -f artifacts/vectile-macos-universal.zip

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum vectile-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: commit_log.md
          files: artifacts/*
